<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurora Nights</title>
<style>
  :root { --bg: #05070c; --ice: #cfeaff; --frost: #f2f7fb; --muted: #7c8ba3; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--frost); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap');

  #scene-container { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: 0; cursor: grab; }
  #scene-container.dragging { cursor: grabbing; }
  #scene-container canvas { display: block; }

  .brand {
    position: fixed; top: 32px; left: 48px; z-index: 5;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em;
    color: var(--muted); pointer-events: none;
  }

  .scroll-spacer { height: 480vh; }

  .hint {
    position: fixed; bottom: 36px; left: 48px; z-index: 5;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 10px;
    transition: opacity 0.6s ease;
  }
  .hint .line { width: 28px; height: 1px; background: var(--muted); }

  .info-panel {
    position: fixed; left: 50%; bottom: 56px; z-index: 6;
    transform: translate(-50%, 12px);
    width: min(440px, calc(100vw - 64px));
    background: rgba(8, 12, 20, 0.55);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(16px);
    border-radius: 14px;
    padding: 24px 26px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .info-panel.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .info-panel .n { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ice); letter-spacing: 0.08em; margin-bottom: 10px; }
  .info-panel h3 { font-size: 19px; font-weight: 500; margin-bottom: 8px; }
  .info-panel p { font-size: 14px; line-height: 1.55; color: var(--muted); }
</style>
</head>
<body>

<div id="scene-container"></div>
<div class="brand">AURORA NIGHTS</div>
<div class="hint" id="hint"><span class="line"></span>scroll to move through — click a crystal for details</div>
<div class="info-panel" id="infoPanel">
  <div class="n" id="infoN">01</div>
  <h3 id="infoTitle"></h3>
  <p id="infoBody"></p>
</div>

<div class="scroll-spacer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  const container = document.getElementById('scene-container');
  const hint = document.getElementById('hint');
  const infoPanel = document.getElementById('infoPanel');
  const infoN = document.getElementById('infoN');
  const infoTitle = document.getElementById('infoTitle');
  const infoBody = document.getElementById('infoBody');

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 300);
  camera.position.set(0, 0, 9);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  container.appendChild(renderer.domElement);

  function makeGlowTexture(hexColor) {
    const size = 128;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    grad.addColorStop(0, hexColor + 'ff');
    grad.addColorStop(0.4, hexColor + '88');
    grad.addColorStop(1, hexColor + '00');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(canvas);
  }
  const glowTexWhite = makeGlowTexture('#eaf6ff');
  const glowTexBlue  = makeGlowTexture('#5fb4ff');
  const glowTexPurple= makeGlowTexture('#a56bff');

  function makeStarLayer(count, spread, size, color, dMin, dMax) {
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const r = spread * (0.4 + Math.random() * 0.6);
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(Math.random() * 2 - 1);
      positions[i*3] = r * Math.sin(ph) * Math.cos(th);
      positions[i*3+1] = r * Math.sin(ph) * Math.sin(th);
      positions[i*3+2] = THREE.MathUtils.randFloat(dMin, dMax);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const mat = new THREE.PointsMaterial({ color, size, transparent: true, opacity: 0.8, sizeAttenuation: true });
    return new THREE.Points(geo, mat);
  }
  const stars = makeStarLayer(1400, 80, 0.06, 0x9fc9ff, -90, 10);
  scene.add(stars);

  // ambient nebula drifting through the whole depth of the path
  ['#3a2a6b', '#1f4d7a', '#6b2a5a', '#2a5a4d'].map(makeGlowTexture).forEach((tex, i) => {
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false });
    const sprite = new THREE.Sprite(mat);
    sprite.position.set((i % 2 ? 1 : -1) * (14 + i * 3), (i % 2 ? -1 : 1) * 8, -i * 20 - 5);
    const s = 32 + Math.random() * 18;
    sprite.scale.set(s, s, 1);
    scene.add(sprite);
  });

  scene.add(new THREE.AmbientLight(0x4a7fae, 1.6));

  // ---- shared detailed snowflake silhouette ----
  function buildSnowflakeShape() {
    const shape = new THREE.Shape();
    const template = [
      [0.09, 0.20], [0.24, 0.38], [0.12, 0.48], [0.075, 0.94], [0.00, 1.12],
      [-0.075, 0.94], [-0.12, 0.48], [-0.24, 0.38], [-0.09, 0.20],
    ];
    const points = [];
    for (let a = 0; a < 6; a++) {
      const angle = (a / 6) * Math.PI * 2;
      const cos = Math.cos(angle), sin = Math.sin(angle);
      template.forEach(([x, y]) => points.push(new THREE.Vector2(x * cos - y * sin, x * sin + y * cos)));
    }
    shape.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) shape.lineTo(points[i].x, points[i].y);
    shape.closePath();
    return shape;
  }
  const flakeGeo = new THREE.ExtrudeGeometry(buildSnowflakeShape(), { depth: 0.05, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 1 });
  flakeGeo.translate(0, 0, -0.025);

  function makeIceMaterial() {
    return new THREE.ShaderMaterial({
      uniforms: { uColorCore: { value: new THREE.Color(0xbfe8ff) }, uColorRim: { value: new THREE.Color(0xffffff) }, uGlow: { value: 1.4 } },
      vertexShader: `
        varying vec3 vNormal; varying vec3 vViewDir;
        void main() {
          vNormal = normalize(normalMatrix * normal);
          vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
          vViewDir = normalize(-mvPos.xyz);
          gl_Position = projectionMatrix * mvPos;
        }
      `,
      fragmentShader: `
        varying vec3 vNormal; varying vec3 vViewDir;
        uniform vec3 uColorCore; uniform vec3 uColorRim; uniform float uGlow;
        void main() {
          float fresnel = pow(1.0 - max(dot(vNormal, vViewDir), 0.0), 2.0);
          vec3 col = mix(uColorCore, uColorRim, fresnel) * uGlow;
          gl_FragColor = vec4(col, 0.95);
        }
      `,
      transparent: true,
    });
  }
  const edgeMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 });

  // full detailed snowflake (used for the solo centerpiece + cluster members)
  function buildFullSnowflake(detail) {
    const iceMaterial = makeIceMaterial();
    const group = new THREE.Group();
    const core = new THREE.Mesh(flakeGeo, iceMaterial);
    core.scale.setScalar(0.55);
    group.add(core);
    const armList = [];
    const branchCount = detail ? 5 : 2;

    function buildArm() {
      const arm = new THREE.Group();
      const spineLen = 2.6;
      const spineGeo = new THREE.BoxGeometry(0.09, spineLen, 0.09);
      spineGeo.translate(0, spineLen / 2, 0);
      arm.add(new THREE.Mesh(spineGeo, iceMaterial), new THREE.LineSegments(new THREE.EdgesGeometry(spineGeo), edgeMaterial));
      for (let i = 1; i <= branchCount; i++) {
        const t = i / (branchCount + 1);
        const yPos = t * spineLen * 0.92;
        const branchLen = 0.7 * (1 - t * 0.6);
        const angle = Math.PI / 3.4;
        [1, -1].forEach((side) => {
          const bGeo = new THREE.BoxGeometry(0.05, branchLen, 0.05);
          bGeo.translate(0, branchLen / 2, 0);
          const b = new THREE.Mesh(bGeo, iceMaterial);
          b.position.set(0, yPos, 0);
          b.rotation.z = side * angle;
          arm.add(b);
        });
      }
      const tipCrystal = new THREE.Mesh(flakeGeo, iceMaterial);
      tipCrystal.scale.setScalar(0.4);
      tipCrystal.position.set(0, spineLen, 0);
      arm.add(tipCrystal);
      const sparkle = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexWhite, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false }));
      sparkle.position.set(0, spineLen, 0);
      sparkle.scale.set(0.45, 0.45, 1);
      arm.add(sparkle);
      arm.userData.sparkle = sparkle;
      return arm;
    }

    for (let i = 0; i < 6; i++) {
      const arm = buildArm();
      arm.rotation.z = (Math.PI * 2 * i) / 6;
      group.add(arm);
      armList.push(arm);
    }
    group.userData.arms = armList;
    group.userData.iceMaterial = iceMaterial;
    return group;
  }

  // tiny mini-flake (reused for cluster/ring/spiral scenes)
  const miniColors = ['#eaf6ff', '#9fd8ff', '#c9b6ff', '#ffd6f0'];
  function buildMiniFlake() {
    const color = miniColors[Math.floor(Math.random() * miniColors.length)];
    const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, side: THREE.DoubleSide });
    const group = new THREE.Group();
    group.add(new THREE.Mesh(flakeGeo, mat));
    const glint = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexWhite, color, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false }));
    glint.scale.set(0.6, 0.6, 1);
    group.add(glint);
    group.userData.material = mat;
    group.userData.twinklePhase = Math.random() * Math.PI * 2;
    group.userData.twinkleSpeed = 0.6 + Math.random() * 1.4;
    group.userData.spinSpeed = (Math.random() - 0.5) * 0.4;
    return group;
  }

  // invisible click-target sphere added to a group
  function addClickTarget(group, radius, sceneIndex) {
    const geo = new THREE.SphereGeometry(radius, 12, 12);
    const mat = new THREE.MeshBasicMaterial({ visible: true, transparent: true, opacity: 0.0001, depthWrite: false });
    const hit = new THREE.Mesh(geo, mat);
    hit.userData.sceneIndex = sceneIndex;
    group.add(hit);
    return hit;
  }

  // ---- scene content ----
  const sceneDefs = [
    { title: 'Aurora Nights', n: '01', info: 'Dec 12 – Jan 5, Central Meadow Park. One long winter night, carried by a single crystal.' },
    { title: 'Crystal Walk', n: '02', info: 'A path through illuminated snowflake sculptures, each one grown larger than the last.' },
    { title: 'Aurora Stage', n: '03', info: 'Live sets under a ring of drifting light. The lineup changes nightly, the sky never repeats.' },
    { title: 'Frost Market', n: '04', info: 'Mulled wine, hand-carved ornaments, and small fires between the crystal groves.' },
  ];

  const waypoints = [
    { x: 0,    y: 0,    z: 9   },
    { x: 0,    y: 0,    z: 0   },
    { x: -4,   y: 0.6,  z: -16 },
    { x: 3.5,  y: -0.4, z: -32 },
    { x: -2,   y: 0.8,  z: -48 },
    { x: -2,   y: 0.8,  z: -54 },
  ];

  const sceneGroups = [];
  const clickTargets = [];

  // Scene 0: solo radiant centerpiece
  const scene0 = buildFullSnowflake(true);
  scene0.position.set(0, 0, 0);
  scene.add(scene0);
  sceneGroups.push(scene0);
  clickTargets.push(addClickTarget(scene0, 3.2, 0));

  [[2.4, glowTexBlue, 0.55], [3.4, glowTexPurple, 0.32], [4.6, glowTexWhite, 0.18]].forEach(([sc, tex, op]) => {
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false }));
    glow.scale.set(sc * 3, sc * 3, 1);
    glow.userData.baseScale = sc * 3;
    scene0.add(glow);
  });

  // Scene 1: cluster / constellation of medium snowflakes
  const scene1 = new THREE.Group();
  scene1.position.set(-4, 0.6, -16);
  scene.add(scene1);
  sceneGroups.push(scene1);
  const clusterMembers = [];
  for (let i = 0; i < 5; i++) {
    const f = buildFullSnowflake(false);
    const ang = (i / 5) * Math.PI * 2;
    f.position.set(Math.cos(ang) * 2.6, Math.sin(ang) * 1.6, Math.sin(ang * 2) * 1.4);
    f.scale.setScalar(0.55 + Math.random() * 0.25);
    scene1.add(f);
    clusterMembers.push(f);
  }
  clickTargets.push(addClickTarget(scene1, 4, 1));

  // Scene 2: rotating ring of mini snowflakes (a halo of light)
  const scene2 = new THREE.Group();
  scene2.position.set(3.5, -0.4, -32);
  scene.add(scene2);
  sceneGroups.push(scene2);
  const ringMembers = [];
  const RING_COUNT = 60;
  for (let i = 0; i < RING_COUNT; i++) {
    const f = buildMiniFlake();
    const ang = (i / RING_COUNT) * Math.PI * 2;
    const r = 3.2 + Math.sin(ang * 5) * 0.2;
    f.position.set(Math.cos(ang) * r, Math.sin(ang * 3) * 0.35, Math.sin(ang) * r);
    f.scale.setScalar(0.35 + Math.random() * 0.25);
    f.userData.ringAngle = ang;
    scene2.add(f);
    ringMembers.push(f);
  }
  clickTargets.push(addClickTarget(scene2, 4, 2));

  // Scene 3: spiral column of mini snowflakes (a frost tree)
  const scene3 = new THREE.Group();
  scene3.position.set(-2, 0.8, -48);
  scene.add(scene3);
  sceneGroups.push(scene3);
  const spiralMembers = [];
  const SPIRAL_COUNT = 90;
  for (let i = 0; i < SPIRAL_COUNT; i++) {
    const f = buildMiniFlake();
    const t = i / SPIRAL_COUNT;
    const ang = t * Math.PI * 10;
    const r = 2.2 * (1 - t) + 0.15;
    const y = t * 5 - 2.5;
    f.position.set(Math.cos(ang) * r, y, Math.sin(ang) * r);
    f.scale.setScalar(0.28 + Math.random() * 0.18);
    scene3.add(f);
    spiralMembers.push(f);
  }
  clickTargets.push(addClickTarget(scene3, 3.5, 3));

  // ---- scroll-driven camera path ----
  let scrollT = 0;
  function updateScroll() {
    const max = document.body.scrollHeight - window.innerHeight;
    scrollT = max > 0 ? Math.min(Math.max(window.scrollY / max, 0), 1) : 0;
  }
  window.addEventListener('scroll', () => {
    updateScroll();
    hint.style.opacity = scrollT > 0.03 ? 0 : 1;
  });
  updateScroll();

  function cameraPathPosition(t) {
    const segCount = waypoints.length - 1;
    const scaled = t * segCount;
    let idx = Math.floor(scaled);
    if (idx >= segCount) idx = segCount - 1;
    const localT = scaled - idx;
    const a = waypoints[idx], b = waypoints[idx + 1];
    return {
      x: THREE.MathUtils.lerp(a.x, b.x, localT),
      y: THREE.MathUtils.lerp(a.y, b.y, localT),
      z: THREE.MathUtils.lerp(a.z, b.z, localT),
    };
  }

  // ---- drag-to-rotate (spins whichever scenes are near the camera) ----
  let isDragging = false, dragMoved = false, prevX = 0, prevY = 0, downX = 0, downY = 0, rotVelX = 0, rotVelY = 0;
  function onPointerDown(e) {
    isDragging = true; dragMoved = false;
    container.classList.add('dragging');
    const p = e.touches ? e.touches[0] : e;
    prevX = p.clientX; prevY = p.clientY; downX = p.clientX; downY = p.clientY;
  }
  function onPointerMove(e) {
    if (!isDragging) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - prevX, dy = p.clientY - prevY;
    if (Math.hypot(p.clientX - downX, p.clientY - downY) > 6) dragMoved = true;
    prevX = p.clientX; prevY = p.clientY;
    rotVelY = dx * 0.006; rotVelX = dy * 0.006;
    sceneGroups.forEach((g) => { g.rotation.y += rotVelY; g.rotation.x += rotVelX; });
  }
  function onPointerUp(e) {
    isDragging = false;
    container.classList.remove('dragging');
    if (!dragMoved) handleClick(e);
  }

  const raycaster = new THREE.Raycaster();
  const mouseNDC = new THREE.Vector2();
  let activeScene = -1;

  function handleClick(e) {
    const p = e.changedTouches ? e.changedTouches[0] : e;
    mouseNDC.x = (p.clientX / window.innerWidth) * 2 - 1;
    mouseNDC.y = -(p.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouseNDC, camera);
    const hits = raycaster.intersectObjects(clickTargets, false);
    if (hits.length > 0) {
      const idx = hits[0].object.userData.sceneIndex;
      if (activeScene === idx) {
        activeScene = -1;
        infoPanel.classList.remove('show');
      } else {
        activeScene = idx;
        const d = sceneDefs[idx];
        infoN.textContent = d.n;
        infoTitle.textContent = d.title;
        infoBody.textContent = d.info;
        infoPanel.classList.add('show');
      }
    } else {
      activeScene = -1;
      infoPanel.classList.remove('show');
    }
  }

  window.addEventListener('mousedown', onPointerDown);
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);
  window.addEventListener('touchstart', onPointerDown, { passive: true });
  window.addEventListener('touchmove', onPointerMove, { passive: true });
  window.addEventListener('touchend', onPointerUp);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    const t = clock.getElapsedTime();

    const camPos = cameraPathPosition(scrollT);
    camera.position.set(camPos.x, camPos.y + Math.sin(t * 0.3) * 0.05, camPos.z);

    if (!isDragging) {
      rotVelX *= 0.94; rotVelY *= 0.94;
      sceneGroups.forEach((g) => { g.rotation.x += rotVelX; g.rotation.y += rotVelY + dt * 0.04; });
    }

    // scene 0: pulse + sparkle
    scene0.position.y = Math.sin(t * 0.5) * 0.12;
    scene0.userData.iceMaterial.uniforms.uGlow.value = 1.3 + Math.sin(t * 1.6) * 0.35;
    scene0.children.forEach((child) => {
      if (child.userData.baseScale) {
        const pulse = 1 + Math.sin(t * 1.2 + child.userData.baseScale) * 0.08;
        child.scale.set(child.userData.baseScale * pulse, child.userData.baseScale * pulse, 1);
      }
    });
    scene0.userData.arms.forEach((arm, i) => {
      const s = arm.userData.sparkle;
      const pulse = 0.45 + Math.sin(t * 2.2 + i) * 0.15;
      s.scale.set(pulse, pulse, 1);
    });

    // scene 1: cluster members drift + spin
    clusterMembers.forEach((f, i) => {
      f.rotation.y += dt * (0.15 + i * 0.02);
      f.userData.iceMaterial.uniforms.uGlow.value = 1.2 + Math.sin(t * 1.4 + i) * 0.3;
    });

    // scene 2: ring rotates as a whole + individual twinkle
    ringMembers.forEach((f) => {
      f.rotation.x += f.userData.spinSpeed * dt;
      f.rotation.y += f.userData.spinSpeed * dt * 0.6;
      f.userData.material.opacity = 0.35 + Math.abs(Math.sin(t * f.userData.twinkleSpeed + f.userData.twinklePhase)) * 0.65;
    });
    scene2.rotation.y = t * 0.08;

    // scene 3: spiral slowly turns, individual twinkle
    spiralMembers.forEach((f) => {
      f.rotation.x += f.userData.spinSpeed * dt;
      f.rotation.y += f.userData.spinSpeed * dt * 0.6;
      f.userData.material.opacity = 0.35 + Math.abs(Math.sin(t * f.userData.twinkleSpeed + f.userData.twinklePhase)) * 0.65;
    });
    scene3.rotation.y = t * 0.05;

    stars.rotation.y = t * 0.004;

    renderer.render(scene, camera);
  }

  animate();
})();
</script>

</body>
</html>
